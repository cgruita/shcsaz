<body>
  <header>
    <h1>Phoenix Metro Weekly Assisted Living Events</h1>
    <p id="week-summary">Loading events...</p>
    <p id="map-version" hidden>Version …</p>
    <div class="view-toggle" role="tablist" aria-label="View">
      <button type="button" data-view="map" class="active" role="tab" aria-selected="true">Map</button>
      <button type="button" data-view="split" role="tab" aria-selected="false">Split</button>
      <button type="button" data-view="table" role="tab" aria-selected="false">Table</button>
    </div>
  </header>

  <div class="split" id="split" data-view="map">
    <div class="layout">
      <div id="map"></div>
      <div
        class="split-handle-v"
        id="split-handle-v"
        role="separator"
        aria-orientation="vertical"
        aria-label="Resize map and list"
        tabindex="0"
      ></div>
      <aside id="event-list"></aside>
    </div>
    <div
      class="split-handle"
      id="split-handle"
      role="separator"
      aria-orientation="horizontal"
      aria-label="Resize map and table"
      tabindex="0"
    ></div>
    <section id="event-table-view"></section>
  </div>

  <script>
    // ?version alone is enough. Fetches version.txt with a timestamp so GitHub
    // Pages cannot serve a stale build id from an old HTML cache entry.
    (function () {
      if (!new URLSearchParams(location.search).has("version") && location.hash !== "#version") return;
      function paint(ver) {
        var el = document.getElementById("map-version");
        if (!el) {
          el = document.createElement("p");
          el.id = "map-version";
          var header = document.querySelector("header");
          (header || document.body).appendChild(el);
        }
        el.hidden = false;
        el.removeAttribute("hidden");
        el.textContent = "Version " + ver;
        document.title = "AL map " + ver;
      }
      paint("loading…");
      fetch("version.txt?t=" + Date.now(), { cache: "no-store" })
        .then(function (r) { return r.text(); })
        .then(function (t) {
          var ver = (t || "").trim() || (typeof MAP_VERSION !== "undefined" ? MAP_VERSION : "unknown");
          paint(ver);
        })
        .catch(function () {
          paint(typeof MAP_VERSION !== "undefined" ? MAP_VERSION : "unknown");
        });
    })();
  </script>
  <script src="https://api.mapbox.com/mapbox-gl-js/v3.6.0/mapbox-gl.js"></script>
  <script src="js/config.js?v=2026-11-22-1"></script>
  <script src="js/map.js?v=2026-11-22-1"></script>
  <script>
    // Register the service worker only on https so local http previews
    // are never intercepted. Network-first in sw.js keeps weekly updates fresh.
    if ("serviceWorker" in navigator && location.protocol === "https:") {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("/sw.js");
      });
    }
  </script>
  <script>
    // GoatCounter still counts PWA launches; tag the path so they are
    // distinguishable from regular visits when query params are kept.
    window.goatcounter = {
      path: function (p) {
        try {
          if (new URLSearchParams(location.search).get("source") !== "pwa") return p;
          if (p && p.indexOf("source=pwa") !== -1) return p;
          var base = p || location.pathname;
          return base + (base.indexOf("?") === -1 ? "?" : "&") + "source=pwa";
        } catch (e) {
          return p;
        }
      }
    };
  </script>
  <script data-goatcounter="https://assistedlivingevents.goatcounter.com/count"
          async src="//gc.zgo.at/count.js"></script>
