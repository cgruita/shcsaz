<!DOCTYPE html>
<html lang="en" data-map-version="2026-09-21-1">
<head>
  <meta charset="UTF-8" />
  <title>Phoenix Metro Weekly Assisted Living Events</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://api.mapbox.com/mapbox-gl-js/v3.6.0/mapbox-gl.css" rel="stylesheet" />
  <link href="vendor/leaflet/leaflet.css" rel="stylesheet" />
  <link href="css/styles.css?v=2026-09-21-1" rel="stylesheet" />
</head>
<body>
  <header>
    <h1>Phoenix Metro Weekly Assisted Living Events</h1>
    <p id="week-summary">Loading events...</p>
    <p id="map-version" hidden></p>
    <div class="view-toggle" role="tablist" aria-label="View">
      <button type="button" data-view="map" class="active" role="tab" aria-selected="true">Map</button>
      <button type="button" data-view="split" role="tab" aria-selected="false">Split</button>
      <button type="button" data-view="table" role="tab" aria-selected="false">Table</button>
    </div>
  </header>

  <div class="split" id="split" data-view="map">
    <div class="layout">
      <div id="map"></div>
      <div
        class="split-handle-v"
        id="split-handle-v"
        role="separator"
        aria-orientation="vertical"
        aria-label="Resize map and list"
        tabindex="0"
      ></div>
      <aside id="event-list"></aside>
    </div>
    <div
      class="split-handle"
      id="split-handle"
      role="separator"
      aria-orientation="horizontal"
      aria-label="Resize map and table"
      tabindex="0"
    ></div>
    <section id="event-table-view"></section>
  </div>

  <script>
    // Inline so ?version works even when map.js is stuck in an old cache.
    (function () {
      if (!new URLSearchParams(location.search).has("version")) return;
      var ver = "2026-09-21-1";
      var el = document.getElementById("map-version");
      if (!el) {
        el = document.createElement("p");
        el.id = "map-version";
        var header = document.querySelector("header");
        (header || document.body).appendChild(el);
      }
      el.hidden = false;
      el.removeAttribute("hidden");
      el.textContent = "Version " + ver;
      el.style.cssText = "display:block!important;margin:8px 0 0;padding:6px 10px;background:#0f2a43;color:#fff;font:600 14px/1.3 system-ui,sans-serif;border-radius:6px;width:fit-content;";
      document.title = "AL map " + ver;
    })();
  </script>
  <script src="https://api.mapbox.com/mapbox-gl-js/v3.6.0/mapbox-gl.js"></script>
  <script src="js/config.js?v=2026-09-21-1"></script>
  <script src="js/map.js?v=2026-09-21-1"></script>
</body>
</html>
