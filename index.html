<body>
  <header>
    <h1>Phoenix Metro Weekly Assisted Living Events</h1>
    <p id="week-summary">Loading events...</p>
    <p id="map-version" hidden>Version …</p>
    <div class="view-toggle" role="tablist" aria-label="View">
      <button type="button" data-view="map" class="active" role="tab" aria-selected="true">Map</button>
      <button type="button" data-view="split" role="tab" aria-selected="false">Split</button>
      <button type="button" data-view="table" role="tab" aria-selected="false">Table</button>
    </div>
    <a class="credit" href="https://lightonhomes.com" target="_blank" rel="noopener" aria-label="Map by Light On (opens in new tab)">
      <span>Map by</span>
      <img class="credit-logo" src="images/light-on-logo.png" width="74" height="32" alt="Light On – Assisted Living Photography" />
    </a>
  </header>

  <div class="split" id="split" data-view="map">
    <div class="layout">
      <div id="map"></div>
      <div
        class="split-handle-v"
        id="split-handle-v"
        role="separator"
        aria-orientation="vertical"
        aria-label="Resize map and list"
        tabindex="0"
      ></div>
      <aside id="event-list"></aside>
    </div>
    <div
      class="split-handle"
      id="split-handle"
      role="separator"
      aria-orientation="horizontal"
      aria-label="Resize map and table"
      tabindex="0"
    ></div>
    <section id="event-table-view"></section>
  </div>

  <script>
    // ?version alone is enough. Fetches version.txt with a timestamp so GitHub
    // Pages cannot serve a stale build id from an old HTML cache entry.
    (function () {
      if (!new URLSearchParams(location.search).has("version") && location.hash !== "#version") return;
      function paint(ver) {
        var el = document.getElementById("map-version");
        if (!el) {
          el = document.createElement("p");
          el.id = "map-version";
          var header = document.querySelector("header");
          (header || document.body).appendChild(el);
        }
        el.hidden = false;
        el.removeAttribute("hidden");
        el.textContent = "Version " + ver;
        document.title = "AL map " + ver;
      }
      paint("loading…");
      fetch("version.txt?t=" + Date.now(), { cache: "no-store" })
        .then(function (r) { return r.text(); })
        .then(function (t) {
          var ver = (t || "").trim() || (typeof MAP_VERSION !== "undefined" ? MAP_VERSION : "unknown");
          paint(ver);
        })
        .catch(function () {
          paint(typeof MAP_VERSION !== "undefined" ? MAP_VERSION : "unknown");
        });
    })();
  </script>
